<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>На Крыше — Персонал</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Inter:wght@300;400;500&display=swap');

    :root {
      --bg: #140B00;
      --bg-card: #241005;
      --bg-card-hover: #2E140A;
      --accent: #B87333;
      --accent-dim: rgba(184, 115, 51, 0.14);
      --text: #F0DFC0;
      --text-muted: #8A6A52;
      --text-sub: #C9A880;
      --border: rgba(240,223,192,0.08);
      --radius: 18px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      overscroll-behavior: none;
    }

    .screen { display: none; padding: 20px 16px 40px; }
    .screen.active { display: block; }

    h1, h2, .heading { font-family: 'Jost', sans-serif; }

    /* HEADER */
    .header { padding: 20px 16px 14px; display: flex; align-items: center; gap: 12px; }
    .header h1 { font-size: 18px; font-weight: 500; letter-spacing: 2px; text-transform: uppercase; }
    .header p { font-size: 10px; color: var(--text-muted); letter-spacing: 1.5px; text-transform: uppercase; margin-top: 2px; }
    .back-btn { width: 34px; height: 34px; border-radius: 50%; background: var(--bg-card); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }

    /* PIN SCREEN */
    #screen-pin { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .pin-title { font-size: 20px; font-weight: 400; letter-spacing: 3px; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
    .pin-sub { font-size: 12px; color: var(--text-muted); margin-bottom: 32px; }
    .pin-dots { display: flex; gap: 14px; margin-bottom: 32px; }
    .pin-dot { width: 14px; height: 14px; border-radius: 50%; border: 1px solid var(--border); background: transparent; transition: background 0.15s, border-color 0.15s; }
    .pin-dot.filled { background: var(--accent); border-color: var(--accent); }
    .pin-keypad { display: grid; grid-template-columns: repeat(3, 64px); gap: 14px; }
    .pin-key { width: 64px; height: 64px; border-radius: 50%; background: var(--bg-card); border: 1px solid var(--border); color: var(--text); font-size: 22px; font-family: 'Jost', sans-serif; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .pin-key:active { background: var(--bg-card-hover); }
    .pin-key.empty { background: none; border: none; cursor: default; }
    .pin-error { color: #ef4444; font-size: 12px; margin-top: 16px; height: 16px; }

    /* SEARCH */
    .search-box { display: flex; gap: 10px; margin-bottom: 18px; }
    .search-input {
      flex: 1;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      outline: none;
    }
    .search-input:focus { border-color: rgba(184,115,51,0.4); }
    .search-input::placeholder { color: var(--text-muted); }
    .btn-primary {
      background: var(--accent-dim);
      color: var(--accent);
      border: 1px solid rgba(184,115,51,0.35);
      border-radius: 14px;
      padding: 14px 18px;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-primary:active { background: rgba(184,115,51,0.24); }
    .btn-full { width: 100%; text-align: center; margin-top: 8px; }

    .result-item {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .result-item:active { background: var(--bg-card-hover); }
    .result-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--accent-dim); color: var(--accent); display: flex; align-items: center; justify-content: center; font-family: 'Jost', sans-serif; font-size: 15px; flex-shrink: 0; }

    .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 13px; line-height: 1.6; }

    /* GUEST CARD */
    .guest-name { font-family: 'Jost', sans-serif; font-size: 22px; font-weight: 500; margin-bottom: 4px; }
    .status-pill { display: inline-block; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; padding: 4px 12px; border-radius: 100px; margin-bottom: 18px; }
    .status-pill.vip { background: rgba(184,115,51,0.2); color: var(--accent); border: 1px solid rgba(184,115,51,0.4); }
    .status-pill.postoyanny { background: rgba(74,222,128,0.12); color: #4ade80; border: 1px solid rgba(74,222,128,0.3); }
    .status-pill.redkiy { background: rgba(240,223,192,0.08); color: var(--text-sub); border: 1px solid var(--border); }

    .info-row {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }
    .info-row:active { background: var(--bg-card-hover); }
    .info-row-icon { color: var(--accent); flex-shrink: 0; }
    .info-row-label { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 2px; }
    .info-row-value { font-size: 14px; color: var(--text); }
    .info-row-edit { margin-left: auto; color: var(--text-muted); flex-shrink: 0; }

    .visit-item { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; margin-bottom: 8px; }
    .visit-date { font-size: 11px; color: var(--accent); letter-spacing: 0.5px; margin-bottom: 6px; }
    .visit-detail { font-size: 13px; color: var(--text-sub); line-height: 1.6; }

    .sec { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--text-muted); margin: 20px 0 10px; }

    /* FORM */
    .form-group { margin-bottom: 14px; }
    .form-label { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px; display: block; }
    .form-input {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      outline: none;
    }
    .form-input:focus { border-color: rgba(184,115,51,0.4); }
    textarea.form-input { resize: none; height: 80px; }
    select.form-input { cursor: pointer; }

    .chip-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .chip {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 100px;
      padding: 10px 16px;
      font-size: 13px;
      color: var(--text-sub);
      cursor: pointer;
    }
    .chip.selected { background: var(--accent-dim); border-color: rgba(184,115,51,0.4); color: var(--accent); }

    /* OVERLAY */
    .overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 500;
      padding: 20px;
    }
    .overlay.show { display: flex; }
    .overlay-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px 24px;
      max-width: 320px;
      width: 100%;
      text-align: center;
    }
    .overlay-icon { width: 52px; height: 52px; border-radius: 50%; background: var(--accent-dim); display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
    .overlay-title { font-family: 'Jost', sans-serif; font-size: 16px; letter-spacing: 1px; color: var(--accent); margin-bottom: 6px; }
    .overlay-sub { font-size: 12px; color: var(--text-muted); margin-bottom: 20px; }
    .overlay-buttons { display: flex; gap: 10px; }
    .overlay-btn { flex: 1; padding: 12px; border-radius: 100px; font-size: 12px; letter-spacing: 0.5px; cursor: pointer; border: 1px solid var(--border); background: none; color: var(--text-sub); font-family: 'Inter', sans-serif; }
    .overlay-btn.primary { background: var(--accent-dim); border-color: rgba(184,115,51,0.35); color: var(--accent); }

    .loading { text-align: center; padding: 30px; color: var(--text-muted); font-size: 13px; }
  </style>
</head>
<body>

<!-- PIN SCREEN -->
<div class="screen active" id="screen-pin">
  <div class="pin-title">На Крыше</div>
  <div class="pin-sub">Вход для персонала</div>
  <div class="pin-dots" id="pinDots">
    <div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div>
    <div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div>
  </div>
  <div class="pin-keypad" id="pinKeypad">
    <button class="pin-key" onclick="pinPress('1')">1</button>
    <button class="pin-key" onclick="pinPress('2')">2</button>
    <button class="pin-key" onclick="pinPress('3')">3</button>
    <button class="pin-key" onclick="pinPress('4')">4</button>
    <button class="pin-key" onclick="pinPress('5')">5</button>
    <button class="pin-key" onclick="pinPress('6')">6</button>
    <button class="pin-key" onclick="pinPress('7')">7</button>
    <button class="pin-key" onclick="pinPress('8')">8</button>
    <button class="pin-key" onclick="pinPress('9')">9</button>
    <button class="pin-key empty"></button>
    <button class="pin-key" onclick="pinPress('0')">0</button>
    <button class="pin-key" onclick="pinBackspace()">⌫</button>
  </div>
  <div class="pin-error" id="pinError"></div>
</div>

<!-- HOME / SEARCH -->
<div class="screen" id="screen-home">
  <div class="header">
    <div>
      <h1>На Крыше</h1>
      <p>Персонал · Гости</p>
    </div>
  </div>
  <div style="padding:0 16px">
    <div class="search-box">
      <input class="search-input" id="searchInput" type="text" placeholder="Имя гостя" onkeydown="if(event.key==='Enter') doSearch()">
      <button class="btn-primary" onclick="doSearch()">Найти</button>
    </div>
    <button class="btn-primary btn-full" onclick="openNewGuest()">+ Новый гость</button>
    <div class="sec">Результаты</div>
    <div id="searchResults"><div class="empty-state">Введите имя гостя для поиска</div></div>
  </div>
</div>

<!-- GUEST CARD -->
<div class="screen" id="screen-card">
  <div class="header">
    <div class="back-btn" onclick="showScreen('home')">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="15 18 9 12 15 6"/></svg>
    </div>
    <div>
      <h1 style="font-size:14px;letter-spacing:1px;">Карточка гостя</h1>
    </div>
  </div>
  <div style="padding:0 16px" id="cardContent"><div class="loading">Загружаю...</div></div>
</div>

<!-- NEW GUEST -->
<div class="screen" id="screen-new-guest">
  <div class="header">
    <div class="back-btn" onclick="showScreen('home')">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="15 18 9 12 15 6"/></svg>
    </div>
    <div>
      <h1 style="font-size:14px;letter-spacing:1px;">Новый гость</h1>
    </div>
  </div>
  <div style="padding:0 16px">
    <div class="form-group">
      <label class="form-label">Имя гостя</label>
      <input class="form-input" id="ngName" type="text" placeholder="Имя">
    </div>
    <div class="form-group">
      <label class="form-label">Статус</label>
      <div class="chip-row" id="ngStatusChips">
        <div class="chip selected" data-value="Редкий" onclick="selectChip(this,'ngStatusChips')">Редкий</div>
        <div class="chip" data-value="Постоянный" onclick="selectChip(this,'ngStatusChips')">Постоянный</div>
        <div class="chip" data-value="VIP" onclick="selectChip(this,'ngStatusChips')">VIP</div>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">День рождения (необязательно)</label>
      <input class="form-input" id="ngBirthday" type="date">
    </div>
    <div class="form-group">
      <label class="form-label">Телефон (необязательно)</label>
      <input class="form-input" id="ngPhone" type="tel" placeholder="+7">
    </div>
    <div class="form-group">
      <label class="form-label">Что важно для гостя</label>
      <textarea class="form-input" id="ngImportant" placeholder="Сервис, место, атмосфера..."></textarea>
    </div>
    <button class="btn-primary btn-full" id="ngSubmitBtn" onclick="submitNewGuest()">Создать карточку</button>
  </div>
</div>

<!-- ADD VISIT -->
<div class="screen" id="screen-visit">
  <div class="header">
    <div class="back-btn" onclick="showScreen('card')">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="15 18 9 12 15 6"/></svg>
    </div>
    <div>
      <h1 style="font-size:14px;letter-spacing:1px;" id="visitGuestNameHeader">Визит</h1>
    </div>
  </div>
  <div style="padding:0 16px">
    <div class="form-group">
      <label class="form-label">🪄 Что заказал по кальяну</label>
      <input class="form-input" id="visitHookah" type="text" placeholder="Например: Персик со льдом">
    </div>
    <div class="form-group">
      <label class="form-label">📝 Заметки</label>
      <textarea class="form-input" id="visitNotes" placeholder="Необязательно"></textarea>
    </div>
    <button class="btn-primary btn-full" id="visitSubmitBtn" onclick="submitVisit()">Сохранить визит</button>
  </div>
</div>

<!-- EDIT FIELD OVERLAY -->
<div class="overlay" id="editOverlay">
  <div class="overlay-card">
    <div class="overlay-title" id="editOverlayTitle">Изменить</div>
    <div style="margin-bottom:18px;text-align:left;" id="editOverlayBody"></div>
    <div class="overlay-buttons">
      <button class="overlay-btn" onclick="closeEditOverlay()">Отмена</button>
      <button class="overlay-btn primary" id="editOverlaySave" onclick="saveEditField()">Сохранить</button>
    </div>
  </div>
</div>

<!-- SUCCESS OVERLAY -->
<div class="overlay" id="successOverlay" onclick="if(event.target===this) this.classList.remove('show')">
  <div class="overlay-card">
    <div class="overlay-icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12 9 17 20 6"/></svg>
    </div>
    <div class="overlay-title" id="successTitle">Готово</div>
    <div class="overlay-sub" id="successSub"></div>
  </div>
</div>

<script>
  const tg = window.Telegram?.WebApp;
  if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor('#140B00'); tg.setBackgroundColor('#140B00'); }

  const PROXY_BASE = 'https://staff-proxy-na-kryishe-production.up.railway.app';

  // ─── PIN ───────────────────────────────────────

  let pinValue = '';

  function pinPress(digit) {
    if (pinValue.length >= 6) return;
    pinValue += digit;
    renderPinDots();
    if (pinValue.length === 6) attemptLogin();
  }

  function pinBackspace() {
    pinValue = pinValue.slice(0, -1);
    renderPinDots();
    document.getElementById('pinError').textContent = '';
  }

  function renderPinDots() {
    const dots = document.querySelectorAll('.pin-dot');
    dots.forEach((d, i) => d.classList.toggle('filled', i < pinValue.length));
  }

  async function attemptLogin() {
    try {
      const res = await fetch(`${PROXY_BASE}/api/staff/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pin: pinValue })
      });
      if (res.ok) {
        try { localStorage.setItem('staff_pin', pinValue); } catch {}
        showScreen('home');
      } else {
        document.getElementById('pinError').textContent = 'Неверный PIN-код';
        pinValue = '';
        renderPinDots();
      }
    } catch {
      document.getElementById('pinError').textContent = 'Ошибка соединения';
      pinValue = '';
      renderPinDots();
    }
  }

  function getPin() {
    try { return localStorage.getItem('staff_pin') || ''; } catch { return ''; }
  }

  // ─── NAVIGATION ────────────────────────────────

  const screens = ['pin', 'home', 'card', 'new-guest', 'visit'];
  function showScreen(name) {
    screens.forEach(s => document.getElementById('screen-' + s)?.classList.remove('active'));
    document.getElementById('screen-' + name)?.classList.add('active');
    window.scrollTo(0, 0);
  }

  // ─── SEARCH ────────────────────────────────────

  async function doSearch() {
    const name = document.getElementById('searchInput').value.trim();
    const resultsEl = document.getElementById('searchResults');
    if (!name) {
      resultsEl.innerHTML = '<div class="empty-state">Введите имя гостя для поиска</div>';
      return;
    }
    resultsEl.innerHTML = '<div class="loading">Ищу...</div>';

    try {
      const res = await fetch(`${PROXY_BASE}/api/staff/search?name=${encodeURIComponent(name)}&pin=${getPin()}`);
      if (res.status === 401) { showScreen('pin'); return; }
      const results = await res.json();

      if (!results.length) {
        resultsEl.innerHTML = `<div class="empty-state">Гость «${name}» не найден.<br>Можно создать новую карточку.</div>`;
        return;
      }

      resultsEl.innerHTML = results.map(g => `
        <div class="result-item" onclick="openGuestCard('${g.id}')">
          <div class="result-avatar">${(g.name || '?').charAt(0).toUpperCase()}</div>
          <div>${g.name}</div>
        </div>
      `).join('');
    } catch {
      resultsEl.innerHTML = '<div class="empty-state">Не удалось выполнить поиск</div>';
    }
  }

  // ─── GUEST CARD ────────────────────────────────

  let currentGuest = null;

  async function openGuestCard(id) {
    showScreen('card');
    const el = document.getElementById('cardContent');
    el.innerHTML = '<div class="loading">Загружаю...</div>';

    try {
      const res = await fetch(`${PROXY_BASE}/api/staff/guest/${id}?pin=${getPin()}`);
      if (res.status === 401) { showScreen('pin'); return; }
      const guest = await res.json();
      currentGuest = guest;
      renderGuestCard(guest);
    } catch {
      el.innerHTML = '<div class="empty-state">Не удалось загрузить карточку</div>';
    }
  }

  function statusClass(status) {
    if (status === 'VIP') return 'vip';
    if (status === 'Постоянный') return 'postoyanny';
    return 'redkiy';
  }

  function renderGuestCard(guest) {
    const el = document.getElementById('cardContent');
    const editIcon = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.1 2.1 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>';

    const birthdayDisplay = guest.birthday
      ? new Date(guest.birthday).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' })
      : 'Не указан';

    const visitsHtml = guest.visits.length
      ? guest.visits.map(v => `
          <div class="visit-item">
            <div class="visit-date">🗓 ${v.date || '—'}</div>
            <div class="visit-detail">🪄 ${v.hookah || '—'}</div>
            ${v.notes ? `<div class="visit-detail">📝 ${v.notes}</div>` : ''}
          </div>
        `).join('')
      : '<div class="empty-state">Визитов пока нет</div>';

    el.innerHTML = `
      <div class="guest-name">${guest.name}</div>
      <div class="status-pill ${statusClass(guest.status)}">${guest.status || 'Не указан'}</div>

      <div class="info-row" onclick="openEditField('status','Статус гостя')">
        <div class="info-row-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M12 2l7 4v6c0 5-3 8-7 10-4-2-7-5-7-10V6l7-4z"/></svg></div>
        <div><div class="info-row-label">Статус</div><div class="info-row-value">${guest.status || 'Не указан'}</div></div>
        <div class="info-row-edit">${editIcon}</div>
      </div>

      <div class="info-row" onclick="openEditField('birthday','Дата рождения')">
        <div class="info-row-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M12 2c-1.5 2.5-3 4.5-3 7a3 3 0 006 0c0-2.5-1.5-4.5-3-7z"/><line x1="12" y1="14" x2="12" y2="22"/></svg></div>
        <div><div class="info-row-label">День рождения</div><div class="info-row-value">${birthdayDisplay}</div></div>
        <div class="info-row-edit">${editIcon}</div>
      </div>

      <div class="info-row" onclick="openEditField('phone','Телефон')">
        <div class="info-row-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="6" y="2" width="12" height="20" rx="2"/><line x1="10" y1="18" x2="14" y2="18"/></svg></div>
        <div><div class="info-row-label">Телефон</div><div class="info-row-value">${guest.phone || 'Не указан'}</div></div>
        <div class="info-row-edit">${editIcon}</div>
      </div>

      <div class="info-row" onclick="openEditField('important','Что важно для гостя')">
        <div class="info-row-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M12 3l1.3 5.7L19 10l-5.7 1.3L12 17l-1.3-5.7L5 10l5.7-1.3L12 3z"/></svg></div>
        <div><div class="info-row-label">Важно для гостя</div><div class="info-row-value">${guest.important || 'Не указано'}</div></div>
        <div class="info-row-edit">${editIcon}</div>
      </div>

      <button class="btn-primary btn-full" onclick="openAddVisit()">🪄 Добавить визит</button>

      <div class="sec">Последние визиты</div>
      ${visitsHtml}
    `;
  }

  // ─── EDIT FIELD ────────────────────────────────

  let editingField = null;

  function openEditField(field, title) {
    editingField = field;
    document.getElementById('editOverlayTitle').textContent = title;
    const body = document.getElementById('editOverlayBody');

    if (field === 'status') {
      body.innerHTML = `<div class="chip-row" id="editStatusChips">
        ${['Редкий','Постоянный','VIP'].map(s => `<div class="chip ${currentGuest.status===s?'selected':''}" data-value="${s}" onclick="selectChip(this,'editStatusChips')">${s}</div>`).join('')}
      </div>`;
    } else if (field === 'birthday') {
      body.innerHTML = `<input class="form-input" id="editInput" type="date" value="${currentGuest.birthday || ''}">`;
    } else if (field === 'phone') {
      body.innerHTML = `<input class="form-input" id="editInput" type="tel" value="${currentGuest.phone || '+7'}" oninput="formatRuPhone(this)">`;
    } else if (field === 'important') {
      body.innerHTML = `<textarea class="form-input" id="editInput">${currentGuest.important || ''}</textarea>`;
    }

    document.getElementById('editOverlay').classList.add('show');
  }

  function closeEditOverlay() {
    document.getElementById('editOverlay').classList.remove('show');
  }

  function selectChip(el, containerId) {
    document.querySelectorAll(`#${containerId} .chip`).forEach(c => c.classList.remove('selected'));
    el.classList.add('selected');
  }

  async function saveEditField() {
    let value;
    if (editingField === 'status') {
      const sel = document.querySelector('#editStatusChips .chip.selected');
      value = sel ? sel.dataset.value : currentGuest.status;
    } else {
      value = document.getElementById('editInput').value.trim();
    }

    try {
      await fetch(`${PROXY_BASE}/api/staff/guest/${currentGuest.id}?pin=${getPin()}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pin: getPin(), field: editingField, value })
      });
      closeEditOverlay();
      openGuestCard(currentGuest.id);
    } catch {
      alert('Не удалось сохранить');
    }
  }

  // ─── NEW GUEST ─────────────────────────────────

  function openNewGuest() {
    document.getElementById('ngName').value = '';
    document.getElementById('ngBirthday').value = '';
    document.getElementById('ngPhone').value = '';
    document.getElementById('ngImportant').value = '';
    document.querySelectorAll('#ngStatusChips .chip').forEach((c, i) => c.classList.toggle('selected', i === 0));
    showScreen('new-guest');
  }

  async function submitNewGuest() {
    const name = document.getElementById('ngName').value.trim();
    if (!name) { alert('Укажите имя гостя'); return; }

    const statusChip = document.querySelector('#ngStatusChips .chip.selected');
    const status = statusChip ? statusChip.dataset.value : 'Редкий';
    const birthday = document.getElementById('ngBirthday').value;
    const phone = document.getElementById('ngPhone').value.trim();
    const important = document.getElementById('ngImportant').value.trim();

    const btn = document.getElementById('ngSubmitBtn');
    btn.disabled = true;
    btn.textContent = 'Создаём...';

    try {
      const res = await fetch(`${PROXY_BASE}/api/staff/guest?pin=${getPin()}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pin: getPin(), name, status, birthday, phone, important })
      });
      const data = await res.json();

      btn.disabled = false;
      btn.textContent = 'Создать карточку';

      if (data.ok) {
        showSuccess('Карточка создана', name);
        openGuestCard(data.id);
      } else {
        alert('Не удалось создать карточку');
      }
    } catch {
      btn.disabled = false;
      btn.textContent = 'Создать карточку';
      alert('Не удалось создать карточку');
    }
  }

  // ─── ADD VISIT ─────────────────────────────────

  function openAddVisit() {
    document.getElementById('visitHookah').value = '';
    document.getElementById('visitNotes').value = '';
    document.getElementById('visitGuestNameHeader').textContent = currentGuest.name;
    showScreen('visit');
  }

  async function submitVisit() {
    const hookah = document.getElementById('visitHookah').value.trim();
    if (!hookah) { alert('Укажите что заказал гость'); return; }
    const notes = document.getElementById('visitNotes').value.trim();

    const btn = document.getElementById('visitSubmitBtn');
    btn.disabled = true;
    btn.textContent = 'Сохраняем...';

    try {
      await fetch(`${PROXY_BASE}/api/staff/visit?pin=${getPin()}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pin: getPin(), guestId: currentGuest.id, guestName: currentGuest.name, hookah, notes })
      });
      btn.disabled = false;
      btn.textContent = 'Сохранить визит';
      showSuccess('Визит сохранён', currentGuest.name);
      openGuestCard(currentGuest.id);
    } catch {
      btn.disabled = false;
      btn.textContent = 'Сохранить визит';
      alert('Не удалось сохранить визит');
    }
  }

  // ─── HELPERS ───────────────────────────────────

  function showSuccess(title, sub) {
    document.getElementById('successTitle').textContent = title;
    document.getElementById('successSub').textContent = sub || '';
    const overlay = document.getElementById('successOverlay');
    overlay.classList.add('show');
    setTimeout(() => overlay.classList.remove('show'), 2500);
  }

  function formatRuPhone(input) {
    const cursorPos = input.selectionStart ?? input.value.length;
    const oldValue = input.value;
    let digitsBeforeCursor = 0;
    for (let i = 0; i < cursorPos && i < oldValue.length; i++) {
      if (/\d/.test(oldValue[i])) digitsBeforeCursor++;
    }
    let digits = oldValue.replace(/\D/g, '');
    if (digits.startsWith('8')) digits = '7' + digits.slice(1);
    if (!digits.startsWith('7')) digits = '7' + digits;
    digits = digits.slice(0, 11);
    const d = digits.slice(1);
    let formatted = '+7';
    if (d.length > 0) formatted += ' (' + d.slice(0, 3);
    if (d.length >= 3) formatted += ')';
    if (d.length > 3) formatted += ' ' + d.slice(3, 6);
    if (d.length > 6) formatted += '-' + d.slice(6, 8);
    if (d.length > 8) formatted += '-' + d.slice(8, 10);
    input.value = formatted;
    let count = 0, newPos = formatted.length;
    for (let i = 0; i < formatted.length; i++) {
      if (count === digitsBeforeCursor) { newPos = i; break; }
      if (/\d/.test(formatted[i])) count++;
    }
    input.setSelectionRange(newPos, newPos);
  }

  // ─── INIT ──────────────────────────────────────

  const savedPin = getPin();
  if (savedPin) {
    // Проверяем что PIN всё ещё действителен (не поменяли после увольнения)
    fetch(`${PROXY_BASE}/api/staff/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pin: savedPin })
    }).then(res => {
      if (res.ok) showScreen('home');
    }).catch(() => {});
  }
</script>
</body>
</html>
